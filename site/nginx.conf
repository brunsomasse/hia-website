# HIA Website — Nginx Configuration
# Serves static files + proxies /api/payment to the payment container

server {
    listen 80;
    server_name hope-international-association.com www.hope-international-association.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hope-international-association.com www.hope-international-association.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/hope-international-association.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hope-international-association.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect www → non-www
    if ($host = www.hope-international-association.com) {
        return 301 https://hope-international-association.com$request_uri;
    }

    # Static HTML — never cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Images — cache 1 day
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Videos — stream with range support
    location /videos/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # JS files — cache 1 hour
    location ~* \.js$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── Proxy payment requests to the payment container ──
    location /api/payment/ {
        proxy_pass http://payment:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
