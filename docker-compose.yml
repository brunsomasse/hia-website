version: "3.9"

services:

  # ── Container 1: Static Website (Nginx) ──────────────────────────────────
  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    container_name: hia-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - payment
    networks:
      - hia-network

  # ── Container 2: Stripe Payment Service (Node.js/Express) ────────────────
  payment:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: hia-payment
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PORT=3001
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://hope-international-association.com}
    networks:
      - hia-network

  # ── Container 3: Certbot (SSL certificate renewal) ───────────────────────
  certbot:
    image: certbot/certbot
    container_name: hia-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

networks:
  hia-network:
    driver: bridge
